<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আপন বাজার – প্রাইস ট্যাগ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f4f4; --fg:#111; --card:#fff; --line:#d0d0d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#f0f0f0; --card:#242424; --line:#3a3a3a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg);
         font-family:"Hind Siliguri","Nirmala UI","Noto Sans Bengali",sans-serif; }
  main { max-width:680px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 16px; }

  /* ---------- Price tag ---------- */
  .tag { container-type:inline-size; width:100%; aspect-ratio:16/9; background:#000; color:#fff;
         display:grid; grid-template-columns:73fr 22fr; grid-template-rows:24fr 24fr 40fr;
         gap:3.5%; padding:3%; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .row, .pct { background:#fff; color:#000; border-radius:2.8cqw; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:0 4cqw; }
  .label { font-size:6.2cqw; font-weight:700; white-space:nowrap; }
  .value { font-family:"Arial Black",Arial,sans-serif; font-style:italic; font-weight:900;
           font-size:11cqw; flex:1; text-align:center; line-height:1; }
  .pct { grid-column:2; grid-row:1 / 3; display:flex; flex-direction:column; align-items:center;
         justify-content:center; text-align:center; padding:2cqw 1cqw; }
  .pct .t { font-size:4.2cqw; font-weight:700; line-height:1.1; }
  .pct .s { font-family:"Arial Black",Arial,sans-serif; font-size:7cqw; font-weight:900; line-height:1; }
  .pct .n { font-family:"Arial Black",Arial,sans-serif; font-size:10cqw; font-weight:900; line-height:1.1; }
  .foot { grid-column:1 / -1; display:flex; align-items:center; gap:3cqw; padding:0 1cqw; }
  .foot img { height:100%; max-height:18cqw; width:auto; object-fit:contain; min-width:0; }
  .foot p { margin:0; font-size:7.8cqw; font-weight:600; line-height:1.2; white-space:nowrap; }

  /* ---------- Controls ---------- */
  .panel { margin-top:20px; padding:16px; background:var(--card); border:1px solid var(--line);
           border-radius:12px; display:grid; gap:12px; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { display:grid; gap:4px; font-size:.9rem; }
  input[type=number] { font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px;
                       background:var(--bg); color:var(--fg); width:100%; }
  button { font:inherit; font-weight:600; padding:10px 18px; border:0; border-radius:8px;
           background:#000; color:#fff; cursor:pointer; justify-self:start; }
  @media (prefers-color-scheme: dark) { button { background:#fff; color:#000; } }

  /* ---------- Print: 88mm printer (Rongta) ---------- */
  @page { size: 88mm 49.5mm; margin: 0; }
  @media print {
    html, body { width:88mm; height:49.5mm; margin:0; padding:0; background:#000; overflow:hidden; }
    h1, .panel { display:none; }
    main { max-width:none; margin:0; }
    .tag { width:88mm; height:49.5mm; aspect-ratio:auto; }
  }
</style>
</head>
<body>
<main>
  <h1>আপন বাজার – প্রাইস ট্যাগ</h1>

  <div class="tag" id="tag">
    <div class="row"><span class="label">বাজার মূল্যঃ</span><span class="value" id="vMarket">0</span></div>
    <div class="pct"><span class="t">পার্সেন্টেজ</span><span class="s">%</span><span class="n" id="vPct">0</span></div>
    <div class="row"><span class="label">আপন মূল্যঃ</span><span class="value" id="vApon">0</span></div>
    <div class="foot">
      <img alt="আপন বাজার" src="logo.svg">
      <p>আপনে বাজার করুন<br>বাজার খরচ কমান ।</p>
    </div>
  </div>

  <section class="panel">
    <div class="fields">
      <label>বাজার মূল্য<input type="number" id="iMarket" min="0" step="any" inputmode="decimal" autofocus></label>
      <label>আপন মূল্য<input type="number" id="iApon" min="0" step="any" inputmode="decimal"></label>
    </div>
    <button type="button" id="print">প্রিন্ট করুন</button>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  function update() {
    const m = parseFloat($("iMarket").value) || 0;
    const a = parseFloat($("iApon").value) || 0;
    const pct = m > 0 ? Math.max(0, Math.round((m - a) / m * 100)) : 0;
    $("vMarket").textContent = m;
    $("vApon").textContent = a;
    $("vPct").textContent = pct;
  }
  ["iMarket", "iApon"].forEach(id => $(id).addEventListener("input", update));
  $("print").addEventListener("click", () => window.print());
  update();
</script>
</body>
</html>
